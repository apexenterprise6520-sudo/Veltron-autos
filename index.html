const closeM=()=>{$("#md").style.display="none";try{speechSynthesis.cancel()}catch(e){}};
let muted=false;
function say(t){try{speechSynthesis.cancel();if(muted)return;const u=new SpeechSynthesisUtterance(t);u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function pp(){try{if(speechSynthesis.paused){speechSynthesis.resume();$("#pb").textContent="⏸ Pause Voice"}else if(speechSynthesis.speaking){speechSynthesis.pause();$("#pb").textContent="▶ Play Voice"}else if(cur){say(desc(cur));$("#pb").textContent="⏸ Pause Voice"}}catch(e){}}
function mute(){muted=!muted;$("#mt").textContent=muted?"🔇":"🔊";if(muted)try{speechSynthesis.cancel()}catch(e){}}

ible cars carry warranty cover. The exact terms are stated on your invoice before you pay."],["What does the warranty cover?","Cover varies by car and is listed in your sales agreement. Ask your advisor for the specific terms."],["What is your return policy?","Return and cancellation terms are agreed in writing before purchase. Please review them with your advisor."],["Can I book a test drive?","Yes, by appointment at our Abuja, Lagos and Dubai locations."],["Can I reserve a car before paying in full?","Yes. A deposit can hold a car for an agreed period, with terms confirmed in writing."],["Can you source a car that is not listed?","Yes. Tell us the make, model, spec and budget and our sourcing team will search for it."],["Do you accept trade-ins?","Send us your car's details and photos for a valuation."],["Are the cars new or used?","We offer both. Each listing's year and condition are confirmed before you book."],["Do the cars come with full documents?","Yes. We provide the paperwork required for registration and import, including title and invoice."],["Is insurance included in shipping?","Insurance for transit is available. Ask your advisor to include full-value cover."],["Can I track my shipment?","Yes. We share updates at each stage, including departure, arrival and clearing."],["Do you deliver to my door?","Yes. Doorstep delivery is available within Nigeria and in many international destinations."],["How can I contact support?","Use the WhatsApp, Call or Email buttons on any page. We reply as quickly as possible."]];

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});

setTimeout(()=>{$("#ld").style.opacity=0;setTimeout(()=>$("#ld").remove(),900)},2000);
